name: Plugin checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_only:
        description: Build the verified release package without rerunning PR-only test suites
        required: false
        type: boolean
        default: false
      release_version:
        description: Exact validated release tag to inject into the release package
        required: false
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.package.outputs.version }}
      prerelease:
        value: ${{ jobs.package.outputs.prerelease }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    if: ${{ !inputs.release_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax
        run: find includes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l && php -l patsch9-foodsettings.php
      - name: Domain, reference and dataset tests
        run: php tests/run.php

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Apply release version from tag
        if: ${{ inputs.release_only }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo '::error::release_version is required for release-only builds.'
            exit 1
          fi
          python3 tools/apply_release_version.py "$RELEASE_VERSION"

      - name: Validate release metadata
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            python3 tools/release_metadata.py --tag "$RELEASE_VERSION" --github-output
          else
            python3 tools/release_metadata.py --github-output
          fi

      - name: Release boundary and result gate regressions
        run: |
          python3 tests/test-release.py
          python3 tests/test-plugin-check.py
      - name: JavaScript syntax
        run: node --check assets/admin.js
      - name: Build installable package and checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            python3 tools/build_zip.py --release-version "$RELEASE_VERSION"
          else
            python3 tools/build_zip.py
          fi

      - name: Verify and extract the actual installable package
        if: ${{ !inputs.release_only }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum -c "patsch9-foodsettings-${VERSION}.zip.sha256"
          unzip -q "patsch9-foodsettings-${VERSION}.zip" -d ../.release-build
      - name: Start disposable WordPress and WooCommerce
        if: ${{ !inputs.release_only }}
        run: |
          npm ci --ignore-scripts --no-fund --prefer-offline
          npm audit --audit-level=high
          node tests/test-admin.cjs
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p .release-build/results
          chmod 777 .release-build/results
          jq -n --arg plugin "$PWD/.release-build/patsch9-foodsettings" --arg tests "$PWD/tests" --arg results "$PWD/.release-build/results" \
            '{core: null, testsEnvironment: false, mappings: {"wp-content/plugins/patsch9-foodsettings": $plugin, "patsch9fs-tests": $tests, "patsch9fs-results": $results}}' > .wp-env.json
          node_modules/.bin/wp-env start
          node_modules/.bin/wp-env run cli wp plugin install woocommerce --activate
          node_modules/.bin/wp-env run cli wp plugin install plugin-check --activate
          node_modules/.bin/wp-env run cli wp plugin activate patsch9-foodsettings
      - name: Integration and security regressions against the installed package
        if: ${{ !inputs.release_only }}
        run: wp-env run cli env PATSCH9FS_RUN_INTEGRATION_TESTS=1 wp eval-file patsch9fs-tests/integration.php
      - name: Strict WordPress Plugin Check on the installed package
        if: ${{ !inputs.release_only }}
        shell: bash
        run: |
          set +e
          # GitHub-only distribution retains Update URI and the requested German readme.
          # Ignore only these three directory policies; all technical checks remain strict.
          wp-env run cli sh -c 'wp plugin check patsch9-foodsettings --format=strict-json \
            --ignore-codes=plugin_updater_detected,readme_short_description_non_official_language,readme_description_non_official_language \
            --require=./wp-content/plugins/plugin-check/cli.php > /var/www/html/patsch9fs-results/plugin-check.txt 2>&1'
          status=$?
          set -e
          cat .release-build/results/plugin-check.txt
          python3 tests/check-plugin-check.py .release-build/results/plugin-check.txt "$status"
      - name: Stop disposable environment
        if: ${{ always() && !inputs.release_only }}
        run: wp-env destroy --force

      - name: Store release assets
        if: ${{ inputs.release_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
