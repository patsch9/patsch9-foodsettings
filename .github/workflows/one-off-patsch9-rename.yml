name: One-off Patsch9 identifier normalization

on:
  push:
    branches:
      - branding/patsch9-name-20261102

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Normalize plugin-owned identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ('P9 Product Settings', 'Patsch9 Food Settings'),
              ('P9 Food Settings', 'Patsch9 Food Settings'),
              ('P9ProductSettings', 'Patsch9FoodSettings'),
              ('Lebensmittel (P9)', 'Lebensmittel (Patsch9)'),
              ('P9 Lebensmitteldaten', 'Patsch9 Lebensmitteldaten'),
              ('P9-Einstellungen', 'Patsch9-Einstellungen'),
              ('patsch9-productsettings', 'patsch9-foodsettings'),
              ('P9PS', 'PATSCH9FS'),
              ('p9ps', 'patsch9fs'),
          )

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for raw in filter(None, paths):
              path = Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          if git grep -n -E 'P9PS|p9ps|patsch9-productsettings|P9 Food Settings|P9 Product Settings|Lebensmittel \(P9\)|P9 Lebensmitteldaten' -- . ':!data/bls/*'; then
            echo '::error::Obsolete Food Settings identifiers remain.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to normalize.'
            exit 0
          fi
          git commit -m 'Refactor Food Settings identifiers to Patsch9'
          git push origin HEAD:branding/patsch9-name-20261102
