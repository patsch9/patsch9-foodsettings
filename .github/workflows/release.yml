name: Build and publish release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require valid tag, main ancestry and merged PR
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/release_metadata.py --tag-only "$GITHUB_REF_NAME" --github-output

          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo '::error::Release tags must point to a commit contained in main.'
            exit 1
          }

          merged_prs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')"
          if [[ "$merged_prs" -lt 1 ]]; then
            echo '::error::Release tags must point to a commit that belongs to a merged pull request targeting main.'
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository] -- Portable same-commit reusable workflow syntax, matching the other Patsch9 plugin repositories.
    with:
      release_only: true
      release_version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
      - name: Verify checksum and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.checks.outputs.version }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
        run: |
          set -euo pipefail
          archive="patsch9-foodsettings-${VERSION}.zip"
          sha256sum -c "${archive}.sha256"
          args=(release create "$GITHUB_REF_NAME" "$archive" "${archive}.sha256"
            --repo "$GH_REPO" --verify-tag
            --title "Patsch9 Food Settings – Lebensmittel ${VERSION}" --generate-notes)
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"

  cleanup:
    name: Published build artifacts entfernen
    needs: publish
    uses: ./.github/workflows/cleanup-artifacts.yml # zizmor: ignore[self-repository] -- Same-commit reusable workflow.
    with:
      run_id: ${{ github.run_id }}
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      actions: write
